<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voicings Pianísticos · Práctica de Progresiones</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Voicings Pianísticos</h1>
    <nav class="mode-tabs">
      <button class="tab-btn active" data-mode="home">Inicio</button>
      <button class="tab-btn" data-mode="learn">Aprendizaje</button>
      <button class="tab-btn" data-mode="practice">Práctica</button>
    </nav>
  </header>

  <main id="app">
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="home-card">
        <h2>Practica los voicings más usados</h2>
        <p>Una aplicación para aprender y practicar los voicings a 4 voces de las progresiones más habituales en pop, rock y soul.</p>
        <div class="home-actions">
          <button class="primary big" data-goto="learn">Modo Aprendizaje</button>
          <button class="primary big" data-goto="practice">Modo Práctica</button>
        </div>
      </div>
    </section>

    <!-- LEARN -->
    <section class="view" id="view-learn">
      <div class="controls">
        <label>
          Progresión
          <select id="learn-progression"></select>
        </label>
        <label>
          Nivel
          <select id="learn-level">
            <option value="1">Nivel 1</option>
            <option value="2">Nivel 2</option>
          </select>
        </label>
        <label>
          Voicing
          <select id="learn-voicing"></select>
        </label>
        <label class="tonality-info">
          Tonalidad: <strong id="learn-key">—</strong>
        </label>
        <div class="ctrl-buttons">
          <button id="learn-new-key" class="primary">Nueva tonalidad</button>
        </div>
      </div>
      <div class="score-area">
        <div id="learn-score" class="score-container"></div>
      </div>
      <div class="legend" id="learn-legend"></div>
    </section>

    <!-- PRACTICE -->
    <section class="view" id="view-practice">
      <div class="controls">
        <label>
          Progresión
          <select id="practice-progression"></select>
        </label>
        <label>
          Voicing
          <select id="practice-voicing"></select>
        </label>
        <label>
          Tempo: <strong id="practice-tempo-val">90</strong> BPM
          <input id="practice-tempo" type="range" min="50" max="160" value="90" />
        </label>
        <div class="ctrl-buttons">
          <button id="practice-play" class="primary">▶ Play</button>
          <button id="practice-pause">❚❚ Pausa</button>
          <button id="practice-stop">■ Stop</button>
        </div>
      </div>
      <div class="score-area">
        <div id="practice-score" class="score-container"></div>
      </div>
      <div class="legend">
        <span id="practice-status">Listo · pulsa Play para comenzar (2 compases de claqueta)</span>
      </div>
    </section>
  </main>

  <script src="js/theory.js"></script>
  <script src="js/progressions.js"></script>
  <script src="js/voicings.js"></script>
  <script src="js/notation.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
